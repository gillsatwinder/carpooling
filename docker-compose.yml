version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carpool_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: true
      WATCHPACK_POLLING: true
      VITE_GEOAPIFY_API_KEY: cd31543b74ea4f0d99576b66f8db3301
    command: npm run dev -- --host 0.0.0.0

    volumes:
      - ./frontend:/app
      - /app/node_modules
  # -----------------------
  # PostgreSQL Database
  # -----------------------
  postgres:
    image: postgres:16
    container_name: carpool_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studentcarpool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # -----------------------
  # ASP.NET Core Backend
  # -----------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carpool_api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: studentcarpool
      DB_USER: postgres
      DB_PASSWORD: postgres
      SMTP_USER: satwinders0504@gmail.com
      SMTP_PASS: mcso pofl tqdt asnc
      EMAIL_FROM: satwinders0504@gmail.com

      OTP_HASH_SECRET: 949226f0dba8ca71759a20bd7c3f0b9477a01153274bb0a3ac7167bc9ebce4f5
      CHOKIDAR_USEPOLLING: true
      WATCHPACK_POLLING: true
    
    volumes:
      - ./backend:/app
      - /app/node_modules
  # -----------------------
  # Optional DB UI Tool
  # -----------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: carpool_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@carpool.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: